name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish or re-publish, e.g. v1.3.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

      - name: Package Chrome zip
        run: cd dist/chrome && zip -r ../aging-tabs-chrome.zip .

      - name: Package Firefox zip
        run: cd dist/firefox && zip -r ../aging-tabs-firefox.zip .

      # Idempotent so a store upload can be retried without deleting the tag:
      # on a re-run the release already exists and only its assets are replaced.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              dist/aging-tabs-chrome.zip \
              dist/aging-tabs-firefox.zip \
              --clobber
          else
            gh release create "$TAG_NAME" \
              --title "Aging Tabs $TAG_NAME" \
              --generate-notes \
              dist/aging-tabs-chrome.zip \
              dist/aging-tabs-firefox.zip
          fi

      - name: Install web-ext
        run: npm install -g web-ext

      # Tolerated: AMO refuses a version it has already signed, so re-publishing
      # the same tag is expected to fail here. Chrome has no such restriction,
      # which is why the step below is NOT tolerated — a silent failure there
      # let two releases report success while the store stayed on the old build.
      - name: Sign and upload to AMO (Firefox)
        continue-on-error: true
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          web-ext sign \
            --source-dir dist/firefox \
            --channel listed \
            --artifacts-dir dist

      - name: Upload to Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source dist/aging-tabs-chrome.zip \
            --extension-id "$CWS_EXTENSION_ID" \
            --client-id "$CWS_CLIENT_ID" \
            --client-secret "$CWS_CLIENT_SECRET" \
            --refresh-token "$CWS_REFRESH_TOKEN" \
            --auto-publish
